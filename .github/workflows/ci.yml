name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Sin secretos. El build no habla con Supabase ni con Vercel.
      # DEMO_MODE queda apagado. En producción el código lo rechaza aunque esté en true.
      DEMO_MODE: "false"
      APP_STAGE: development
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Seed three synthetic users in memory and run browser tests
        run: npm run test:e2e
        env:
          # Solo este paso. El build de arriba sigue con DEMO_MODE=false.
          # El seed vive en memoria. No se inyecta la clave de la base.
          DEMO_MODE: "true"
          SEED_PRODUCT_USERS: "true"
          APP_STAGE: development
          APP_BASE_URL: http://127.0.0.1:3000

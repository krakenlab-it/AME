<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="cedula-anterior-titulo cedula-anterior-desc">
  <title id="cedula-anterior-titulo">Reverso simplificado de una cédula anterior</title>
  <desc id="cedula-anterior-desc">Ilustración original. El código dactilar de ejemplo V1234V5678 está resaltado en la esquina superior derecha del reverso.</desc>
  <rect width="360" height="220" rx="18" fill="#e7f0f6"/>
  <rect x="12" y="12" width="336" height="196" rx="14" fill="#f7fbfe" stroke="#7aa0b8" stroke-width="2"/>
  <rect x="12" y="12" width="336" height="28" rx="14" fill="#1f6f93"/>
  <rect x="12" y="28" width="336" height="12" fill="#1f6f93"/>
  <text x="24" y="32" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="700">REVERSO · EJEMPLO DE CÉDULA ANTERIOR</text>
  <text x="24" y="62" fill="#5c7382" font-family="Arial, sans-serif" font-size="11">Documento ficticio. No copies estos datos.</text>
  <text x="24" y="84" fill="#24343d" font-family="Arial, sans-serif" font-size="13">NUI de ejemplo 0000000000</text>
  <g transform="translate(28,108)">
    <ellipse cx="36" cy="40" rx="34" ry="42" fill="none" stroke="#8aa4b4" stroke-width="2"/>
    <path d="M36 14c8 10 8 22 0 34M28 18c6 8 6 18 0 26M44 18c-6 8-6 18 0 26M36 22v28" fill="none" stroke="#8aa4b4" stroke-width="1.5"/>
    <text x="36" y="98" text-anchor="middle" fill="#5c7382" font-family="Arial, sans-serif" font-size="10">huella de ejemplo</text>
  </g>
  <g>
    <rect x="168" y="96" width="164" height="78" rx="10" fill="#fff4cc" stroke="#c98600" stroke-width="3"/>
    <text x="180" y="118" fill="#8a5a00" font-family="Arial, sans-serif" font-size="11" font-weight="700">CÓDIGO DACTILAR</text>
    <text x="180" y="146" fill="#1a1a1a" font-family="ui-monospace, monospace" font-size="20" font-weight="700">V1234V5678</text>
  </g>
  <text x="24" y="196" fill="#5c7382" font-family="Arial, sans-serif" font-size="10">Esquina superior derecha del reverso</text>
</svg>
